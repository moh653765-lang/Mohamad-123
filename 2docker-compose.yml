services:
  postgres:
    image: postgres:16-alpine
    container_name: vless_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vless
      POSTGRES_USER: vless
      POSTGRES_PASSWORD: change_this_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vless_net

  xray:
    image: teddysun/xray:latest
    container_name: vless_xray
    restart: unless-stopped
    volumes:
      - ./xray:/etc/xray
    ports:
      - "443:443"
    networks:
      - vless_net

  api:
    build: .
    container_name: vless_api
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    depends_on:
      - postgres
      - xray
    networks:
      - vless_net

  bot:
    build: .
    container_name: vless_bot
    restart: unless-stopped
    command: python -m bot.bot
    env_file:
      - .env
    depends_on:
      - postgres
      - api
    networks:
      - vless_net

volumes:
  postgres_data:

networks:
  vless_net:
    driver: bridge